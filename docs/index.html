<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reduce Engine Demo</title>

  <!-- Styles -->
  <link rel="stylesheet" href="../assets/styles.css">

  <!-- Favicons --> 
  <link rel="shortcut icon" href="../assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/favicon-48x48.png">

  <!-- Manifest for PWA -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="header">
    <!-- Brand Logo -->
    <img src="../assets/idshift-reduce-logo.png" alt="IDShift Reduce logo" class="brand-logo">

    <!-- Hero Banner -->
    <img src="../assets/hero-banner.png" alt="iD SCAN banner" class="hero-banner">

    <!-- Title & Subtitle -->
    <h1> Reduce Engine</h1>
    <p>Identity classification & risk reduction</p>
  </header>

  <main class="container">
    <!-- Upload Section -->
    <section class="upload">
      <h2>Upload Accounts JSON</h2>
      <div id="dropZone" class="drop-zone">
        <p>Drag & drop your file here or click to select</p>
        <input type="file" id="fileInput" accept=".json" hidden>
      </div>
      <button id="runButton" class="btn-primary">Run Reduce</button>
    </section>

    <!-- Output Section -->
    <section class="output">
      <h2>Reports</h2>
      <div id="reportGrid" class="report-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Reduce Engine • Deployed on GitHub Pages</p>
  </footer>

  <!-- External JS -->
  <script src="../assets/script.js"></script>
</body>
</html>
